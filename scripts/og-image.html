<!doctype html>
<!--
	Source of static/og-image.png, the share preview for every page (see
	OG_IMAGE_PATH in site.constants.ts). It's a still of the homepage hero --
	the mark, the headline and the credit badge -- in light mode, so a shared
	link looks like the page it opens, and not like llamacpp.org's dark,
	mono preview. The sans is the system font, as on the site, so render it
	on a Mac to get SF Pro. `--channel chrome` uses the installed Chrome, so
	no Playwright browser download is needed:

	npx playwright screenshot --channel chrome --viewport-size=1200,630 scripts/og-image.html static/og-image.png

	1200x630 is the size Facebook, X, LinkedIn and Slack all crop to.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 44px;
				/* The site's light-mode tokens: background, foreground,
				   muted-foreground and border (app.css). */
				background: oklch(1 0 0);
				color: oklch(0.145 0 0);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				text-align: center;
			}

			/* The app's mark and name. The site's header shows the mark alone,
			   but a preview has no page around it to say what it's for. */
			.logo {
				display: flex;
				align-items: center;
				gap: 18px;
				font-size: 46px;
				font-weight: 600;
				letter-spacing: -0.02em;
			}

			.logo svg {
				height: 46px;
				width: auto;
			}

			/* The hero h1, at about its desktop size. */
			h1 {
				margin: 0;
				font-size: 104px;
				line-height: 1.02;
				font-weight: 600;
				letter-spacing: -0.04em;
			}

			/* The hero badge, scaled up so it survives the preview being
			   shown at a fraction of its size. */
			.badge {
				border: 2px solid oklch(0.875 0 0);
				border-radius: 999px;
				padding: 10px 26px;
				font-size: 28px;
				color: oklch(0.556 0 0);
			}
		</style>
	</head>
	<body>
		<div class="logo">
			<!-- The mark from src/lib/assets/brand/icon-light.svg -->
			<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
				<path
					d="M600 392L504.249 558L504.137 557.929C487.252 584.069 458.193 600 426.864 600H120L240 392H600Z"
					fill="currentColor"
				/>
				<path
					d="M240 392H0L199.602 46.0254C216.032 17.5463 246.411 3.25756e-05 279.29 0H466.154L240 392Z"
					fill="currentColor"
				/>
			</svg>
			Llama
		</div>
		<h1>Your AI.<br />On your computer.</h1>
		<div class="badge">By the llama.cpp team and Hugging Face</div>
	</body>
</html>
